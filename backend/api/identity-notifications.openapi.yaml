      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelWrite'
  /api/admin/notifications/channels/{id}:
    put:
      summary: Update notification channels
      description: Requires identity.manage. Optimistic version conflict returns409.
        Managed channels return409; edit them through platform settings.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Attempt or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelWrite'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
