services:
  server:
    environment:
      NT_GUACD_ADDR: guacd:4822
      NT_GUACD_RELAY_HOST: server
      NT_RDP_DRIVE_ENABLED: 'true'
      NT_MP4_URL: http://mp4-renderer:8090
      NT_MP4_TOKEN_FILE: /run/secrets/mp4_token
    secrets: [mp4_token]
    volumes: [storageconfig:/var/lib/next-terminal/storage]
    networks: [graphics, render]
    depends_on:
      mp4-renderer: {condition: service_healthy}
  guacd:
    image: ${PUPPETEER_GRAPHICS_IMAGE:?Set a versioned graphics image}
    build: {context: ../../backend, dockerfile: graphics.Dockerfile}
    # Previously authorized: only the FUSE daemon is root. Guacd runs as UID 1000.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SETUID, SETGID, DAC_OVERRIDE]
    devices: [/dev/fuse:/dev/fuse]
    environment:
      NT_DATABASE_URL_FILE: /run/secrets/database_url
      NT_STORAGE_PROFILE: /var/lib/next-terminal/storage/active.json
    secrets: [database_url]
    volumes: [storageconfig:/var/lib/next-terminal/storage:ro]
    networks: [database, graphics]
    depends_on:
      server: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:rw,size=128m,mode=1777']
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: [CMD, /usr/local/bin/nt-rdp-storage, health]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  mp4-renderer:
    image: ${PUPPETEER_RENDERER_IMAGE:?Set a versioned renderer image}
    build: {context: ../../backend/renderer}
    environment:
      NT_MP4_TOKEN_FILE: /run/secrets/mp4_token
    secrets: [mp4_token]
    networks: [render]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,size=768m,mode=1777']
    mem_limit: 2g
    cpus: 2
    pids_limit: 160
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
secrets:
  mp4_token: {file: '${PUPPETEER_CONFIG_DIR}/secrets/mp4_token'}
volumes:
  storageconfig:
networks:
  graphics: {internal: true}
  render: {internal: true}
