openapi: 3.1.0
info:
  title: Access approval and policy management
  version: r16-remote-access-mfa
  description: Contracts checked against r08_approval.go, r08_policy.go and their
    domain validators. Cookie mutations require allowed Origin. Route coverage is
    not full functional acceptance.
security:
- session: []
paths:
  /api/admin/approval-scopes:
    get:
      summary: List approval scopes
      description: Requires approval.read.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scope'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
    post:
      summary: Create approval scope
      description: Requires identity.manage; changes and audit commit atomically.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scope'
  /api/admin/approval-scopes/{id}:
    put:
      summary: Update approval scope
      description: Requires identity.manage and matching version.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scope'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
  /api/portal/requestable-assets:
    get:
      summary: List eligible request targets
      description: Authenticated user. Matches enabled approval scopes and enabled
        assets; currently scans at most 1000 assets. One asset may appear once per
        matching scope.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    protocol:
                      type: string
                    scopeId:
                      type: string
                      format: uuid
                    scopeName:
                      type: string
                    maxMinutes:
                      type: integer
                  required: []
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
  /api/access-requests:
    get:
      summary: List visible access requests
      description: Own requests, configured reviewer requests, or all for an administrator.
        Fixed page size 50; invalid page values fall back to 1.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Request'
                  total:
                    type: integer
                required:
                - items
                - total
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
    post:
      summary: Submit temporary access request
      description: Requester identity comes from the session. Scope membership, enabled
        asset and maximum duration rechecked; notification queued in the same transaction.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestWrite'
  /api/access-requests/{id}/decision:
    post:
      summary: Approve, reject or cancel request
      description: Matching version required. Approval/rejection requires a configured
        reviewer with approval.review and forbids self-review. Only pending requests
        can be reviewed. Request owner or administrator may cancel pending/approved
        requests. Approval atomically creates a time-bounded grant; cancellation revokes
        that grant. Duration may only shorten. Notifications and audit share the transaction.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionWrite'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
  /api/admin/policies/access-policy:
    get:
      summary: List access-policy
      description: Requires policy.read. Returns complete stored documents with current
        IDs and versions.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
    post:
      summary: Create access-policy
      description: Requires identity.manage. Type-specific validation and policy revision
        increment are atomic with audit.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
  /api/admin/policies/access-policy/{id}:
    put:
      summary: Update access-policy
      description: Requires identity.manage and current document version; policy revision
        increment is atomic with audit.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete access-policy
      description: Requires identity.manage and current version query parameter. Reference
        or stale-version failures return conflict.
      responses:
        '204':
          description: Success
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
  /api/admin/policies/strategy:
