    $ref: ./ldap.openapi.yaml#/paths/~1api~1admin~1ldap-providers~1{id}~1sync-preview
  /api/admin/ldap-sync:
    $ref: ./ldap.openapi.yaml#/paths/~1api~1admin~1ldap-sync
  /healthz:
    get:
      security: []
      responses:
        '200':
          description: Process alive
      operationId: get_healthz
      tags:
      - F00
  /readyz:
    get:
      security: []
      responses:
        '200':
          description: Database and instance state readable
        default:
          $ref: '#/components/responses/Error'
      operationId: get_readyz
      tags:
      - F00
  /api/branding:
    get:
      security: []
      responses:
        '200':
          description: Public branding
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - version
                - copyright
                - icp
                - debug
                properties:
                  name:
                    type: string
                  version:
                    const: r07.3-preview
                  copyright:
                    type: string
                  icp:
                    type: string
                  debug:
                    const: true
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_branding
      tags:
      - M18
  /api/logo:
    get:
      security: []
      responses:
        '200':
          description: Local brand logo
          content:
            image/svg+xml:
              schema:
                type: string
      operationId: get_api_logo
      tags:
      - M18
  /api/setup-status:
    get:
      security: []
      responses:
        '200':
          description: Whether the first administrator is still needed
          content:
            application/json:
              schema:
                type: object
                required:
                - needSetup
                properties:
                  needSetup:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_setup_status
      tags:
      - M01
  /api/setup-user:
    post:
      security: []
      description: Single transactional initialization. Always creates an admin; compatibility
        type/recording/watermark inputs do not grant additional features.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              - newPassword2
              properties:
                username:
                  type: string
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,63}$
                password:
                  type: string
                  minLength: 12
                  description: Maximum 1024 UTF-8 bytes
                newPassword2:
                  type: string
                  description: Must equal password
                type:
                  type: string
                recording:
                  type: string
                watermark:
                  type: string
      responses:
        '204':
          description: Administrator and setup audit committed
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      operationId: post_api_setup_user
      tags:
      - M01
  /api/login-status:
    get:
      security: []
      responses:
        '200':
          description: Password login, captcha and phase-aware MFA; pending/enrollment
            sessions cannot access business APIs.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - passwordEnabled
                - captchaEnabled
                properties:
                  status:
                    enum:
                    - Unlogged
                    - Logged In
                    - OTP Required
                    - MFA Enrollment Required
                  passwordEnabled:
                    const: true
                  captchaEnabled:
                    const: true
                  ldapEnabled:
                    const: false
                  smsEnabled:
                    const: false
                  webauthnEnabled:
                    const: false
                  wechatWorkEnabled:
                    const: false
                  oidcEnabled:
                    const: false
                  phase:
                    enum:
                    - ''
                    - authenticated
                    - mfa_pending
                    - mfa_enroll
        '418':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_login_status
      tags:
      - M01
  /api/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  maxLength: 64
                password:
                  type: string
                  description: Maximum 1024 UTF-8 bytes
                source:
                  enum:
                  - ''
                  - password
                key:
                  type: string
                  description: Required one-use captcha proof bound to nt_captcha
                    cookie; expires in 120 seconds.
      responses:
        '200':
          description: New opaque session in Set-Cookie; no bearer token in JSON
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - needTotp
                properties:
                  token:
                    const: ''
                  needTotp:
                    type: boolean
                  needRebind:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      description: Five failed passwords lock the normalized username for 15 minutes
        in PostgreSQL. Full session 8 hours; MFA pending/enrollment session 5 minutes.
      operationId: post_api_login
      tags:
      - M01
  /api/logout:
    post:
      security: []
      description: Revoke supplied session and expire cookie; idempotent even if unauthenticated.
        Requires allowed Origin.
      responses:
        '204':
          description: Logged out
        default:
          $ref: '#/components/responses/Error'
      operationId: post_api_logout
      tags:
      - M01
  /api/account/info:
    get:
      responses:
        '200':
          description: Current fully authenticated account; actions is authoritative
            for UI visibility. Server rechecks permissions independently.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - username
                - nickname
                - type
                - permissions
                - menus
                - actions
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  nickname:
                    type: string
                  type:
                    enum:
                    - admin
                    - user
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    maxItems: 0
                  menus:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        checked:
                          type: boolean
                  enabledTotp:
                    type: boolean
                  mfaEnabled:
                    type: boolean
                  language:
                    const: zh-CN
                  forceTotpEnabled:
                    const: false
                  needChangePassword:
                    const: false
                  accessRequestEnabled:
                    const: false
                  apiKeyAccessEnabled:
                    const: false
                  dev:
                    const: true
                  passwordSet:
                    const: true
                  actions:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_account_info
      tags:
      - M01
  /api/license:
    get:
      responses:
        '200':
          description: Independent local product descriptor; not an official license
            validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    const: free
                  source:
                    const: local
                  oem:
                    const: false
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_license
      tags:
      - M18
  /api/system/runtime:
    get:
      responses:
        '200':
          description: Authenticated backend identity
          content:
            application/json:
              schema:
                type: object
                required:
                - backendId
                - instanceId
                - release
                - contractVersion
                - schemaVersion
                - capabilitiesRevision
                - round
                - environment
                properties:
                  backendId:
                    const: nt-go
                  instanceId:
                    type: string
                    format: uuid
                  release:
                    const: r07.3-preview
                  contractVersion:
                    const: 1
                  schemaVersion:
                    const: 19
                  capabilitiesRevision:
                    const: 9
                  round:
                    const: R07
                  environment:
                    const: development
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_system_runtime
      tags:
      - M18
  /api/system/capabilities:
    get:
      responses:
        '200':
          description: R07 capabilities include terminal sessions, SFTP, readonly
            observation and recipient-bound sharing. Graphical sessions are available
            when guacd is configured. Platform storage remains pending.
          content:
            application/json:
              schema:
                type: object
                required:
                - schemaVersion
                - revision
                - backendId
                - features
                properties:
                  schemaVersion:
                    const: 1
                  revision:
                    const: 9
                  backendId:
                    const: nt-go
                  features:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                      - state
                      - reason
                      properties:
                        state:
                          enum:
                          - available
                          - not_implemented
                        reason:
                          type:
                          - string
                          - 'null'
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_system_capabilities
      tags:
      - M18
  /api/admin/properties:
    $ref: ./settings.openapi.yaml#/paths/~1admin~1properties
  /api/system/audit/recent:
    get:
      description: Requires audit.read. Latest 20 authentication and management events,
        including target and reset reason. Actor is a user UUID or empty for declared
        local CLI operators.
      responses:
        '200':
          description: Sanitized audit events, newest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  type: object
                  required:
                  - id
                  - action
                  - outcome
                  - requestId
                  - createdAt
                  properties:
                    id:
                      type: string
                      format: uuid
                    action:
                      type: string
                    outcome:
                      type: string
                    requestId:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    actor:
                      type: string
                    details:
                      type: object
                      additionalProperties:
                        type: string
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_system_audit_recent
      tags:
      - M08
  /api/captcha:
    get:
      description: Creates a 120-second slider challenge bound to host-only HttpOnly
        nt_captcha cookie. Response never contains target X. Development anti-replay
        control; not a production anti-bot service.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: &id003
                    type: boolean
                  key: &id001
                    type: string
                  image: *id001
                  tile: *id001
                  width: &id002
                    type: integer
                  height: *id002
                  tileWidth: *id002
                  tileHeight: *id002
                  tileY: *id002
        default:
          $ref: '#/components/responses/Error'
      operationId: get_api_captcha
      security: []
      tags:
      - M01
  /api/captcha/verify:
    post:
      description: Allowed Origin and nt_captcha required. Challenge is consumed on
        first bound attempt, including wrong position. Returns a one-use login proof.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: *id001
                  expiresIn:
                    const: 120
        default:
          $ref: '#/components/responses/Error'
      operationId: post_api_captcha_verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: *id001
                purpose:
                  const: login
                x: *id002
              required:
              - key
              - purpose
              - x
              additionalProperties: false
      tags:
      - M01
  /api/validate-totp:
    post:
      description: Requires mfa_pending session. Exactly one of totp or recoveryCode.
        TOTP is 6-digit SHA1/30s ±1 step with replay prevention. Recovery atomically
        consumes one code, revokes all sessions, and only grants mfa_enroll; rebind
        before business access. Five invalid proofs revoke the pending session.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  needRebind: *id003
        default:
          $ref: '#/components/responses/Error'
      operationId: post_api_validate_totp
      requestBody:
        required: true
        content:
