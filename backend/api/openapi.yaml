    get:
      operationId: get__api_sessions_id_observers_observer_events
      tags:
      - M06
      description: Readonly durable output prefix. Each poll rechecks login binding,
        role or asset grant, share revocation/expiry and source lease. No remote input
        or connection is opened. 64 events/page, sequence bounded by metadata total;
        poll once per second after catching up. Stop after non-writing state and next==total.
      parameters:
