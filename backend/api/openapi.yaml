  /api/sessions:
    post:
      operationId: post_api_sessions
      tags:
      - M06
      description: Full login and current enabled asset grant required, including
        inherited groups/direct departments. 256-bit one-use ticket bound to website
        login; SHA256 only in DB. TTL30s. Global16/user4 reservations, create20/min/user.
        readonly immutable. Unknown/changed-endpoint host key creates failed access
        record and 409. Credential metadata/version pinned, plaintext not returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id012
                  ticket: *id013
                  expiresIn:
                    const: 30
                  readonly: &id016
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId: *id012
                readonly: *id016
              required:
              - assetId
              additionalProperties: false
    get:
      operationId: get_api_sessions
      tags:
      - M06
      description: Own sessions by default. all=true requires session.read. Includes
        access/recording metadata only. 20 per page, newest first.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSHSessionDetail'
                  total: *id014
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: all
        in: query
        schema: *id016
      - name: online
        in: query
        schema: *id016
      - name: current
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
  /api/sessions/{id}:
    get:
      operationId: get_api_sessions_id
      tags:
      - M06
      description: Owner or session.read. Persisted access snapshot and recording
        counters; excludes connection ticket, auth hash and credential references.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHSessionDetail'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id012
  /api/sessions/{id}/recording/segments/{seq}:
    $ref: ./recording-exports.openapi.yaml#/paths/~1api~1sessions~1{id}~1recording~1segments~1{seq}
  /api/sessions/{id}/recording/download:
    $ref: ./recording-exports.openapi.yaml#/paths/~1api~1sessions~1{id}~1recording~1download
  /api/sessions/{id}/recording/mp4:
    $ref: ./recording-exports.openapi.yaml#/paths/~1api~1sessions~1{id}~1recording~1mp4
  /api/sessions/{id}/recording/mp4/download:
    $ref: ./recording-exports.openapi.yaml#/paths/~1api~1sessions~1{id}~1recording~1mp4~1download
  /api/sessions/{id}/recording:
    get:
      operationId: get_api_sessions_id_recording
      tags:
      - M08
      description: Owner or audit.read, checked on every page. Only finalized recordings;
        writing, disabled and expired content return 409. Interrupted recordings expose
        only persisted events. Ordered cursor pages of at most 64 events, raw payload
        base64 encoded. Begin at after=0 and continue using next until next equals
        total. Default terminal is 80x24; resize payload is UTF-8 cols,rows. Duration
        is the last recorded event offset, excluding trailing idle time. Cache-Control
        no-store; initial page writes recording.viewed operation audit. Native media
        requires after=0 and returns segment metadata with an empty events array.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id012
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Recording page
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - bytes
                - total
                - durationMs
                - next
                - events
                - format
                properties:
                  state:
                    type: string
                    enum:
                    - complete
                    - interrupted
                  bytes:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
                  durationMs:
                    type: integer
                    minimum: 0
                  next:
                    type: integer
                    minimum: 0
                  events:
                    type: array
                    maxItems: 64
                    items:
                      type: object
                      required:
                      - sequence
                      - elapsedMs
                      - kind
                      - payload
                      properties:
                        sequence:
                          type: integer
                          minimum: 1
                        elapsedMs:
                          type: integer
                          minimum: 0
                        kind:
                          type: string
                          enum:
                          - output
                          - exec-output
                          - resize
                          - graphics
                        payload:
                          type: string
                          contentEncoding: base64
                  format:
                    type: string
                    enum:
                    - terminal-events-v1
                    - guacamole-events-v1
                    - native-rdp-mp4-v1
                  segments:
                    type: array
                    items:
                      type: object
                      required:
                      - sequence
                      - startMs
                      - durationMs
                      - bytes
                      properties:
                        sequence:
                          type: integer
                          minimum: 1
                          maximum: 2048
                        startMs:
                          type: integer
                          minimum: 0
                        durationMs:
                          type: integer
                          minimum: 0
                        bytes:
                          type: integer
                          minimum: 0
                          maximum: 16777216
        default:
          $ref: '#/components/responses/Error'
  /api/sessions/{id}/terminate:
    post:
      operationId: post_api_sessions_id_terminate
      tags:
      - M06
      description: Owner or administrator. Persist termination request + audit atomically,
        cancel local connection immediately; lease workers observe termination. 204
        acknowledges request, observe final closed state. 409 if already closed.
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id012
  /api/sessions/{id}/commands:
    get:
      operationId: get_api_sessions_id_commands
      tags:
      - M08
      description: Owner or audit.read. Includes explicit SSH exec and terminal input
        submissions. Terminal text is inferred only from visible PTY echo, never raw
        keystrokes; unrecognized entries have empty command text and a note. No remote
        execution or exit-code guarantee for terminal-input. With current, returns
        a page object; without current, retains the legacy newest-100 array response.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/SSHCommand'
                - type: object
                  required:
                  - items
                  - total
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SSHCommand'
                    total:
                      type: integer
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id012
      - name: current
        in: query
        description: Enables paginated object response; 1-based page.
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    post:
      operationId: post_api_sessions_id_commands
      tags:
      - M06
      description: Owner only, connected writable session, current grant/login/versions/lease
        rechecked. Independent SSH exec channel, one at a time per session,20/min/user.
        Command text logged as intentionally submitted, not a secret input field.
        <=4096 bytes,10s timeout,64KiB output. Output recorded then sent over existing
        WS; exit code persisted. Timeout closes SSH transport, no automatic replay,
        remote process cleanup not guaranteed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id012
                  state: *id013
                  exitCode: *id014
                  message: *id013
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  minLength: 1
                  maxLength: 4096
              required:
              - command
              additionalProperties: false
      parameters:
      - name: id
        in: path
        required: true
        schema: *id012
  /api/sessions/{id}/ws:
    get:
      operationId: get_api_sessions_id_ws
      tags:
      - M06
      description: 'WS upgrade: owner cookie AND exact allowed Origin required, reserved
        state only;20 attempts/min/user. First text frame within5s is 3 followed by64
        hexadecimal ticket chars; token never in URL. Atomic consume checks login
        hash+owner+expiry. After attach, client frames 1+UTF8 input, 2+cols,rows (2..500,2..300),9+heartbeat.
        Server3+sessionId connected,6+base64 raw output,0+safe error,4+exit,9+pong.
        Max32KiB frame; client silence20s, writer3s. Readonly rejects1/2 and exec.
        No automatic reconnect/resume/replay. Lease10s,check2s with1s DB budget; login/grant/asset/credential/host-trust
        changes or storage errors close socket. Session <=4h. Persist raw output/resize
        before forwarding;64MiB/session. SSH setup after authentication <=10s. Browser
        WS errors do not revoke site login. Graphics uses the same first-message ticket.
        Server/client frame 7 contains base64 of one Guacamole instruction, frame
        9 is heartbeat. Handshake secrets stay server-side. Only key/mouse/size/sync/nop/ack/disconnect
        are accepted; readonly rejects key/mouse/size; file/clipboard/pipe/object
        inputs rejected. Display instructions are persisted before forwarding.'
      responses:
        '101':
          description: Success
