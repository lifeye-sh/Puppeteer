openapi: 3.1.0
info:
  title: Snippets, scheduled tasks and credential rotation
  version: r16-schema99
  description: Mutation requests require allowed Origin and a login session. Execution
    requires current authorization, SSH host trust and applicable entitlement; queue
    acknowledgement is not execution success. Command text belongs to scoped task/snippet
    records, not general operation audit.
security:
- session: []
paths:
  /api/snippets:
    get:
      summary: List owned and system snippets
      description: Requires authenticated session. 30 per page. Case-insensitive literal
        search on name/description; owner predicate applies to count and rows.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetPage'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or execution conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Execution/probe capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - &id003
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - all
          - mine
          - system
          default: all
      - name: search
        in: query
        schema:
          type: string
          maxLength: 500
    post:
      summary: Save personal snippet
      description: Requires authenticated owner. URL determines owner scope, never
        caller-supplied system flag. PUT uses current version.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: &id001
                    type: string
                    format: uuid
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or execution conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Execution/probe capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnippetWrite'
  /api/snippets/{id}:
    put:
      summary: Save personal snippet
      description: Requires authenticated owner. URL determines owner scope, never
        caller-supplied system flag. PUT uses current version.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
