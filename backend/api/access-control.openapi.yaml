        '422':
          description: Invalid fields or relations
    post:
      summary: Import and activate geodata
      description: Requires identity.manage. JSON body bounded to 32 MiB. Invalid
        input does not replace the active dataset; canonical data digest is recorded.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: UTF-8 byte limit 100
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/GeoEntry'
                  minItems: 1
                  maxItems: 100000
              required:
              - name
              - entries
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nt_session
  schemas:
    ID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    Scope:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: UTF-8 byte limit 100
        requesterIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        departmentIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        resourceIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
          minItems: 1
        reviewerIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
          minItems: 1
        maxMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
      - name
      - resourceIds
      - reviewerIds
      - maxMinutes
      description: At least one requester or department. Combined ID arrays at most
        1000. Reviewers must be enabled and have approval.review. Existing record
        version required for updates.
    RequestWrite:
      type: object
      properties:
        scopeId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: UTF-8 byte limit 2000
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        requestedStart:
          type: string
          format: date-time
          description: Omitted means now; otherwise within one minute in the past
            and seven days in the future
      required:
      - scopeId
      - resourceId
      - reason
      - durationMinutes
    Request:
      type: object
      properties:
        scopeId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: UTF-8 byte limit 2000
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        requestedStart:
          type: string
          format: date-time
          description: Omitted means now; otherwise within one minute in the past
            and seven days in the future
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
          - expired
        reviewerId:
          type: string
        decisionReason:
          type: string
        grantId:
          type: string
        startsAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
      required: []
    DecisionWrite:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - approve
          - reject
          - cancel
        reason:
          type: string
          maxLength: 2000
          description: UTF-8 byte limit 2000
        durationMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: 0 inherits requested duration; approval may shorten, not extend
        strategyId:
          type: string
          description: Optional strategy UUID
        commandFilterId:
          type: string
          description: Optional command filter UUID
      required:
      - version
      - action
    Period:
      type: object
      properties:
        days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          minItems: 1
        start:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
        end:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
      required:
      - days
      - start
      - end
      description: Local clock in policy timezone; Sunday=0. Valid hours/minutes required.
    Rule:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        action:
          type: string
          enum:
          - allow
          - reject
        ips:
          type: array
          items:
            type: string
          maxItems: 1000
        ipSetIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        countries:
          type: array
          items:
            type: string
        provinces:
          type: array
          items:
            type: string
        cities:
          type: array
          items:
            type: string
        periods:
          type: array
          items:
            $ref: '#/components/schemas/Period'
          maxItems: 50
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - action
      description: Combined countries/provinces/cities at most 1000. IP accepts a
        literal, prefix, or address range.
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        global:
          type: boolean
        userIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        departmentIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        resourceIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        mode:
          type: string
          enum:
          - whitelist
          - blacklist
          - ''
        timezone:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
          maxItems: 100
        actions:
          type: object
          properties:
            connect:
              type: boolean
            upload:
              type: boolean
            download:
              type: boolean
            createFile:
              type: boolean
            createDir:
              type: boolean
            edit:
              type: boolean
            delete:
              type: boolean
            rename:
              type: boolean
            chmod:
              type: boolean
            copy:
              type: boolean
            paste:
              type: boolean
            execute:
              type: boolean
            observe:
              type: boolean
            share:
              type: boolean
          required: []
          additionalProperties: false
        patterns:
          type: array
          items:
            type: object
            properties:
              pattern:
                type: string
                minLength: 1
                maxLength: 1024
                description: Go regular expression; UTF-8 byte limit 1024
              action:
                type: string
                enum:
                - allow
                - reject
            required:
            - pattern
            - action
          maxItems: 100
        entries:
          type: array
          items:
            type: string
          maxItems: 10000
      required:
      - name
      description: Combined user/department/resource IDs at most 1000. access-policy
        and command-filter require whitelist/blacklist mode; access-policy requires
        a loadable IANA timezone; ip-set requires at least one valid address, prefix
        or range. Updates require current version.
    PolicyDecision:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        policyId:
          type: string
        revision:
          type: integer
        filtered:
          type: boolean
      required:
      - allowed
      - reason
      - policyId
      - revision
      - filtered
    GeoEntry:
      type: object
      properties:
        prefix:
          type: string
        country:
          type: string
          minLength: 1
        province:
          type: string
        city:
          type: string
      required:
      - prefix
      - country
      description: Prefix parsed and masked to canonical CIDR; duplicate canonical
        prefixes rejected. Combined location UTF-8 bytes at most 500.
    GeoVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        digest:
          type: string
        active:
          type: boolean
        entries:
          type: integer
      required: []
