      - name: id
        in: path
        required: true
        schema: *id001
  /api/rotation-runs/{id}/cancel:
    post:
      summary: Request rotation cancellation
      description: Requires credential.rotate. Actor or administrator; remote changes
        already applied are not silently rolled back.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or execution conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Execution/probe capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/rotation-runs/{id}/targets/{target}/reconcile:
    post:
      summary: Reconcile an unknown rotation
      description: Requires credential.rotate. Actor or administrator,30-second bounded
        probe under concurrency slots. Rechecks current caller IP and target identity.
        Tests old/new credentials without changing target; activates verified candidate
        only with matching asset/credential/trust versions. Uncertain result remains
        unknown. No secret input required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/RotationResult'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or execution conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Execution/probe capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: target
        in: path
        required: true
        schema: *id001
