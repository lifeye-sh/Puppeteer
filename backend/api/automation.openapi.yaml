        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnippetWrite'
    delete:
      summary: Delete snippet
      description: Requires authenticated owner. Owner/scope and optimistic version
        checked together.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or execution conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Execution/probe capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - &id002
        name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
