  /api/admin/policies/explain:
    post:
      summary: Explain effective access decision
      description: Requires identity.manage and an enabled subject. Evaluates current
        resource scope and forced grant policies without creating a session.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecision'
        '401':
          description: Authentication required
        '403':
          description: Permission or browser Origin denied
        '409':
          description: Version, state or reference conflict
        '422':
          description: Invalid fields or relations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                resourceId:
                  type: string
                  format: uuid
                ip:
                  type: string
                action:
                  type: string
                  enum:
                  - connect
                  - upload
                  - download
                  - createFile
                  - createDir
                  - edit
                  - delete
                  - rename
                  - chmod
                  - copy
                  - paste
                  - execute
                  - observe
                  - share
                command:
                  type: string
              required:
              - userId
              - resourceId
              - ip
              - action
  /api/admin/geodata:
