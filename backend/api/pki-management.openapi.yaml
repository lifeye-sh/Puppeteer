        '409':
          description: Version or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid certificate/input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: &id002
                  type: integer
              required:
              - version
  /api/admin/certificates/{id}/reissue:
    post:
      summary: Reissue client certificate
      description: Requires identity.manage. Client certificates only. Same parent/user;
        issues replacement and revokes old unrevoked certificate in one transaction.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
        '400':
          description: Invalid proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or MFA denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid certificate/input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: *id002
                days: *id002
              required:
              - version
  /api/admin/certificates/{id}/p12:
    post:
      summary: Export protected client PKCS12
      description: Requires identity.manage. Administrator account type and bound
        MFA mandatory. Revalidates local password and consumes fresh TOTP; client
        certificate only. Separate exportPassword protects the PKCS12. Audited, Cache-Control:no-store.
      responses:
        '200':
          description: client.p12 attachment
          content:
            application/x-pkcs12:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or MFA denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid certificate/input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                exportPassword:
                  type: string
                  writeOnly: true
                  minLength: 12
                  maxLength: 128
              required:
              - password
              - totp
              - exportPassword
