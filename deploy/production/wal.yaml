# Optional online WAL archive. Set up and check stanza before the first full backup.
# This local volume is NOT an offsite copy. See wal.md.
services:
  postgres:
    image: ${PUPPETEER_POSTGRES_WAL_IMAGE:?Set a versioned PostgreSQL WAL image}
    build: {context: ., dockerfile: postgres.Dockerfile}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=pgbackrest-file --stanza=puppeteer archive-push %p
    secrets: [wal_cipher_pass]
    volumes: [walrepo:/var/lib/pgbackrest]
secrets:
  wal_cipher_pass: {file: '${PUPPETEER_CONFIG_DIR}/secrets/wal_cipher_pass'}
volumes:
  walrepo:
