  /api/admin/notifications/channels/{id}/test:
    post:
      summary: Queue test notification
      description: Requires identity.manage. Requires notification.send entitlement.
        Targets current administrator; asynchronous result is in deliveries, not guaranteed
        by202.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
