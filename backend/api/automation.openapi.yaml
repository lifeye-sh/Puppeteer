  /api/tasks/preview:
    post:
      summary: Preview next ten scheduled times
      description: Requires task.manage. Five-field cron, explicit IANA timezone;
        impossible schedule rejected.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: &id006
                  type: string
                  format: date-time
                minItems: 10
                maxItems: 10
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or owner denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or execution conflict
          content:
