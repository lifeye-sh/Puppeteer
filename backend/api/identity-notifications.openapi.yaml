  /api/admin/notifications/deliveries/{id}/retry:
    post:
      summary: Retry failed delivery
      description: Requires identity.manage. Requires notification.send entitlement.
        Only failed status resets to pending with attempts0; other states are unchanged.
      responses:
        '204':
          description: Success
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
