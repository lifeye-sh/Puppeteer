worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query strings can contain one-use session tickets: never include them in access logs.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        client_max_body_size 128m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        location = /healthz { access_log off; return 200 'ok'; }
        include /etc/nginx/optional/*.conf;
        location ~ ^/(api/|\.well-known/openid-configuration$|swagger/) {
            proxy_pass http://server:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            # This listener is the edge: never inherit client-supplied identity headers.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        # Compress public build artifacts only; authenticated API responses remain
        # uncompressed. Hashed filenames already carry a one-year cache lifetime.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            gzip on;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_comp_level 5;
            gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
        }
        location = /index.html { add_header Cache-Control 'no-store'; }
        location = /sw.js { add_header Cache-Control 'no-store'; }
        location = /release-manifest.json { add_header Cache-Control 'no-store'; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
