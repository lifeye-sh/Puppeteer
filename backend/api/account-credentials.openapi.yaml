openapi: 3.1.0
info:
  title: Personal credentials and preferences
  version: r16-federation-default-departments
  description: Owner-scoped authenticated APIs. Cookie mutations require allowed Origin.
    Password and fresh bound TOTP are required where described; proof secrets are
    never returned. Registration documentation is not a claim of complete product
    acceptance.
security:
- session: []
paths:
  /api/account/api-keys:
    get:
      summary: List own api keys
      description: At most latest 100 records, including expired/revoked metadata.
        No secret readback.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        prefix:
                          type: string
                        publicKey:
                          type: string
                        fingerprint:
                          type: string
                        algorithm:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        revokedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
    post:
      summary: Create personal api key
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. At most 20 active keys of each kind. API keys only support
        profile.read and database.read; they cannot call management or arbitrary APIs.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  secret:
                    type: string
                    description: One-time API key; empty for SSH public-key registration
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                scopes:
                  type: array
                  items:
                    enum:
                    - profile.read
                    - database.read
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
              required:
              - password
              - name
              - days
              - scopes
  /api/account/api-keys/{id}:
    delete:
      summary: Revoke own api key
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Owner scoped; later authentication fails.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
              required:
              - password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/ssh-keys:
    get:
      summary: List own ssh keys
      description: At most latest 100 records, including expired/revoked metadata.
        No secret readback.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        prefix:
                          type: string
                        publicKey:
                          type: string
                        fingerprint:
                          type: string
                        algorithm:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        revokedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
    post:
      summary: Create personal ssh key
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. At most 20 active keys of each kind. API keys only support
        profile.read and database.read; they cannot call management or arbitrary APIs.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  secret:
                    type: string
                    description: One-time API key; empty for SSH public-key registration
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                publicKey:
                  type: string
                  maxLength: 16384
                  description: Single authorized_keys public key without options;
                    Ed25519, ECDSA P256/P384/P521, or RSA >=3072 bits. Certificates
                    and private keys rejected.
              required:
              - password
              - name
              - days
              - publicKey
  /api/account/ssh-keys/{id}:
    delete:
      summary: Revoke own ssh key
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Owner scoped; later authentication fails.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
              required:
              - password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/password:
    get:
      summary: Inspect personal password policy
      description: Allowed in authenticated or password_change phase.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  localPassword:
                    type: boolean
                  expired:
                    type: boolean
                  mfaRequired:
                    type: boolean
                  policy:
                    type: object
                    properties:
                      minLength:
                        type: integer
                      minCharacterType:
                        type: integer
                      mustNotContainUsername:
                        type: boolean
                      mustNotBePalindrome:
                        type: boolean
                      mustNotWeak:
                        type: boolean
                  expirationDays:
                    type: integer
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
    post:
      summary: Change platform password
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Allowed in authenticated or password_change phase. New value
        must equal confirmation, differ from old password and satisfy current policy.
        Clears session cookie; re-login required.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                newPassword:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                confirm:
                  type: string
                  writeOnly: true
                  maxLength: 1024
              required:
              - password
              - newPassword
              - confirm
  /api/account/certificates:
    get:
      summary: List own client certificates
      description: Only client certificates owned by this user; public PEM and metadata
        only, never private keys.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        kind:
                          type: string
                        source:
                          type: string
                        pem:
                          type: string
                        fingerprint:
                          type: string
                        parentId:
                          type: string
                        userId:
                          type: string
                        dnsNames:
                          type: array
                          items:
                            type: string
                        notBefore:
                          type: string
                          format: date-time
                        notAfter:
                          type: string
                          format: date-time
                        revokedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        lastUsedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        version:
                          type: integer
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
  /api/account/certificates/{id}/p12:
    post:
      summary: Export own PKCS12 certificate
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Version and owner checked while locking the certificate.
        Export always requires enrolled TOTP, even if MFA is otherwise optional.
      responses:
        '200':
          description: Encrypted PKCS12 attachment; Cache-Control no-store
          content:
            application/x-pkcs12:
              schema:
                type: string
                format: binary
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                version:
                  type: integer
                exportPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
              required:
              - password
              - version
              - exportPassword
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/certificates/{id}/revoke:
    post:
      summary: Revoke own certificate
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Version and owner checked while locking the certificate.
        Export always requires enrolled TOTP, even if MFA is otherwise optional.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                version:
                  type: integer
              required:
              - password
              - version
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/contacts:
    get:
      summary: List verified contacts
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        kind:
                          enum:
                          - email
                          - phone
                        address:
                          type: string
                        version:
                          type: integer
                        verifiedAt:
                          type: string
                          format: date-time
                  emailEnabled:
                    type: boolean
                  phoneEnabled:
                    type: boolean
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
  /api/account/contacts/{id}:
    delete:
      summary: Remove own verified contact
      description: 'Current platform password and fresh bound TOTP required. Allowed
        Origin required. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
              required:
              - password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/contacts/start:
    post:
      summary: Start contact verification
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Uses administrator-configured delivery channel. Challenge
        is bound to user and browser session.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                  expiresIn:
                    const: 300
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                kind:
                  enum:
                  - email
                  - phone
                address:
                  type: string
              required:
              - password
              - kind
              - address
  /api/account/contacts/finish:
    post:
      summary: Finish contact verification
      description: Authenticated session and allowed Origin. Single-use challenge
        and delivery code; verifies channel, user and settings versions again.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Wrong, expired or consumed challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge:
                  type: string
                  minLength: 64
                  maxLength: 64
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
              required:
              - challenge
              - code
  /api/account/ldap-identities:
    get:
      summary: List own LDAP identities and binding-enabled providers
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        providerId:
                          type: string
                        name:
                          type: string
                        issuer:
                          type: string
                        subject:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
  /api/account/ldap-providers/{id}/bind:
    post:
      summary: Bind verified LDAP identity
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Validates directory credentials over configured TLS and immutable
        identity, then rechecks local user/provider versions. No email-based account
        merge.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
                username:
                  type: string
                  minLength: 1
                directoryPassword:
                  type: string
                  writeOnly: true
                  minLength: 1
              required:
              - password
              - username
              - directoryPassword
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/ldap-identities/{id}:
    delete:
      summary: Remove own LDAP binding
      description: 'Current platform password and fresh bound TOTP required. Allowed
        Origin required. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
              required:
              - password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/native-devices:
    get:
      summary: List own native client grants
      description: Status is full authorization validity, not a claim that hardware
        is online. Metadata supplied by client.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        os:
                          type: string
                        arch:
                          type: string
                        clientVersion:
                          type: string
                        sourceIp:
                          type: string
                        registeredAt:
                          type: string
                          format: date-time
                        lastSeenAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        revokedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        scopes:
                          type: array
                          items:
                            type: string
                        status:
                          enum:
                          - active
                          - revoked
                          - expired
                          - invalid
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    const: 20
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
  /api/account/native-devices/{id}:
    delete:
      summary: Revoke own native client device grant
      description: Current platform password and fresh bound TOTP required. Allowed
        Origin required. Revokes family, prevents pending connections and flags related
        bridge/RDP sessions for termination; active streams also check bounded leases.
        Repeated revoke is idempotent.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
        '400':
          description: Invalid, expired or consumed password/MFA proof
        '409':
          description: Version, capacity or uniqueness conflict
        '422':
          description: Invalid fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                totp:
                  type: string
                  writeOnly: true
                  pattern: ^[0-9]{6}$
              required:
              - password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/account/notifications:
    get:
      summary: Read own notification preferences
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  preference:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      quietStart:
                        type: string
                      quietEnd:
                        type: string
                      timezone:
                        type: string
                  bindings:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        channelId:
                          type: string
                        address:
                          type: string
                        enabled:
                          type: boolean
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
  /api/account/notifications/preference:
    put:
      summary: Update own quiet-time preferences
      description: Allowed Origin; timezone and quiet interval validated.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                quietStart:
                  type: string
                quietEnd:
                  type: string
                timezone:
                  type: string
  /api/account/notifications/bindings/{id}:
    put:
      summary: Toggle own notification channel binding
      description: Addresses are administrator-provisioned; this endpoint only changes
        enabled on an already-owned binding. ID is channelId.
      responses:
        '204':
          description: Success
        '401':
          description: Login required
        '403':
          description: Origin, ownership or permission denied
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nt_session
