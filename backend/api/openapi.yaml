  /api/sessions/{id}/uploads:
    post:
      operationId: post_api_sessions_id_uploads
      tags:
      - M07
      description: Live writable owner. Reserve bounded PostgreSQL staging, 16MiB
        per file, 64MiB and 4 active tasks per actor, 256MiB globally. Client UUID
        is idempotent for identical pending metadata. Task lifetime 15min. Empty expectedHash
        creates only; existing file requires matching content SHA256 (also rechecked
        at commit). Limits are staging/transfer limits, not remote filesystem disk
        quotas.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - path
              - size
              properties:
                id:
                  type: string
                  format: uuid
                path:
                  type: string
                  maxLength: 1024
                size:
                  type: integer
                  minimum: 0
                  maximum: 16777216
                expectedHash:
                  type: string
                  default: ''
      responses:
        '200': &id015
          description: Durable upload status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  sessionId:
                    type: string
                    format: uuid
                  path:
                    type: string
                  size:
                    type: integer
                  received:
                    type: integer
                  state:
                    type: string
                    enum:
                    - receiving
                    - transferring
                    - committing
                    - succeeded
                    - failed
                    - canceled
                    - interrupted
                  message:
                    type: string
                  sha256:
                    type: string
                  cancelRequested:
                    type: boolean
                  cleanupNeeded:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /api/uploads/{task}:
    get:
      operationId: get_api_uploads_task
      tags:
      - M07
      description: Task owner only; readable after session closure to resolve uncertain
        completion.
      parameters:
      - name: task
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200': *id015
        default:
          $ref: '#/components/responses/Error'
  /api/uploads/{task}/chunks:
    put:
      operationId: put_api_uploads_task_chunks
      tags:
      - M07
      description: Live writable task owner. Raw 1..1048576 bytes, sequential offset.
        Same offset and bytes are idempotent; gaps, different repeated bytes, overflow
        or finalized state return 409. Browser completion means staging only.
      parameters:
      - name: task
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200': *id015
        default:
          $ref: '#/components/responses/Error'
  /api/uploads/{task}/commit:
    post:
      operationId: post_api_uploads_task_commit
      tags:
      - M07
      description: Live writable task owner; already succeeded returns stored result
        only. Claim once, write exclusive sibling temp file, chmod 0600 before payload,
        fsync when supported, close, read back SHA256, recheck destination and grant,
        then rename. Existing text edit preserves permission bits, not ACL/owner or
        inode metadata; requires posix-rename extension. Cancellation before committing
        blocks rename; committing cannot be canceled. Uncertain commit is interrupted,
        never retried automatically. Terminal tasks release staging; crash orphans
        are tracked for cleanup on next writable authorized mount. No credential in
        task.
      parameters:
      - name: task
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200': *id015
        default:
          $ref: '#/components/responses/Error'
  /api/uploads/{task}/cancel:
    post:
      operationId: post_api_uploads_task_cancel
      tags:
      - M07
      description: Owner only, including disconnected sessions. Receiving releases
        chunks; transferring requests cancellation. Committing/succeeded returns 409
        without deleting final file.
      parameters:
      - name: task
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200': *id015
        default:
          $ref: '#/components/responses/Error'
  /api/filesystem-logs:
