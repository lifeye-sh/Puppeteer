# Core release: management UI, SSH/SFTP, audit, database and persistent storage.
# Optional graphics/MP4 and protocol listeners: services.yaml and protocols.yaml.
services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: puppeteer
      POSTGRES_DB: puppeteer
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [pgdata:/var/lib/postgresql]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U puppeteer -d puppeteer]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 2g
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  server:
    image: ${PUPPETEER_SERVER_IMAGE:?Set a versioned server image}
    build: {context: ../../backend, dockerfile: production.Dockerfile}
    environment:
      NT_ENV: production
      NT_ADDR: :8089
      NT_DATABASE_URL_FILE: /run/secrets/database_url
      NT_DATABASE_NETWORK: private-container
      NT_MFA_KEY_FILE: /run/secrets/mfa_key
      NT_VAULT_KEY_FILE: /run/secrets/vault_key
      NT_ALLOWED_ORIGINS: ${PUPPETEER_ORIGIN:?Set the public HTTPS origin}
      NT_BACKUP_DIRECTORY: /var/lib/next-terminal/backups
      NT_RESTORE_DIRECTORY: /var/lib/next-terminal/restore
      NT_MP4_DIRECTORY: /var/lib/next-terminal/mp4
      NT_RUNTIME_PROFILE: /var/lib/next-terminal/runtime/active.json
      NT_STORAGE_PROFILE: /var/lib/next-terminal/storage/active.json
      NT_MYSQL_SPOOL_DIR: /tmp/mysql-spool
    secrets: [database_url, mfa_key, vault_key]
    volumes: [appdata:/var/lib/next-terminal]
    networks: [database, control, egress]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:rw,size=256m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: [CMD, /app/nt, health]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  web:
    image: ${PUPPETEER_WEB_IMAGE:?Set a versioned frontend image}
    build: {context: ../../dist/production, dockerfile: ../../deploy/production/frontend.Dockerfile}
    ports: ['${PUPPETEER_BIND:-127.0.0.1}:${PUPPETEER_HTTPS_PORT:-8443}:8443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PUPPETEER_CONFIG_DIR:?Set config directory}/tls:/run/tls:ro
    networks: [control, edge]
    depends_on:
      server: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:rw,size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
secrets:
  database_password: {file: '${PUPPETEER_CONFIG_DIR}/secrets/database_password'}
  database_url: {file: '${PUPPETEER_CONFIG_DIR}/secrets/database_url'}
  mfa_key: {file: '${PUPPETEER_CONFIG_DIR}/secrets/mfa_key'}
  vault_key: {file: '${PUPPETEER_CONFIG_DIR}/secrets/vault_key'}
volumes:
  pgdata:
  appdata:
networks:
  database: {internal: true}
  control: {internal: true}
  egress:
  edge:
