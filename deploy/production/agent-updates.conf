# Only signed metadata and the current Linux amd64 target are exposed.
location ~ "^/agent-updates/([1-9][0-9]{0,3}\.root\.json|targets\.json|snapshot\.json|timestamp\.json|targets/nt-agent-linux-amd64)$" {
    alias /srv/agent-updates/$1;
    default_type application/octet-stream;
    add_header Cache-Control 'no-store';
    add_header X-Content-Type-Options nosniff;
}
location /agent-updates/ { return 404; }
