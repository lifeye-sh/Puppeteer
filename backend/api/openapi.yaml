openapi: 3.1.0
info:
  title: Puppeteer independent backend — R16
  version: puppeteer-branding
  description: R16 development contract index. Current settings, AI, PostgreSQL assets,
    entitlements, statistics and retention use the referenced module contracts. Earlier
    session/resource definitions remain for compatibility and are not a claim of complete
    R16 acceptance. Native R14 exclusions, PostgreSQL readonly-preview limits and
    outstanding functional checks are tracked in docs/backend/acceptance/R16.md. All
    cookie-authenticated mutations require an allowed Origin; credential-only native
    protocol exceptions are enforced by the application.
servers:
- url: https://backend.localhost:5174
security:
- session: []
paths:
  /api/native/v1/assets:
    $ref: ./native-sessions.openapi.yaml#/paths/~1api~1native~1v1~1assets
