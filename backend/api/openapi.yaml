        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - bytes
                - total
                - durationMs
                - next
                - events
                - format
                properties:
                  state:
                    type: string
                    enum:
                    - complete
                    - interrupted
                    - writing
                  bytes:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
                  durationMs:
                    type: integer
                    minimum: 0
                  next:
                    type: integer
                    minimum: 0
                  events:
                    type: array
                    maxItems: 64
                    items:
                      type: object
                      required:
                      - sequence
                      - elapsedMs
                      - kind
                      - payload
                      properties:
                        sequence:
                          type: integer
                          minimum: 1
                        elapsedMs:
                          type: integer
                          minimum: 0
                        kind:
                          type: string
                          enum:
                          - output
                          - exec-output
                          - resize
                          - graphics
                        payload:
                          type: string
                          contentEncoding: base64
                  format:
