openapi: 3.1.0
info:
  title: Notification administration and identity entry controls
  version: r16-schema99
security:
- session: []
paths:
  /api/admin/notifications:
    get:
      summary: Read channels, rules, bindings and deliveries
      description: Requires identity.manage. Channel secrets never returned. Deliveries
        newest first, max200.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rule'
                  bindings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Binding'
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delivery'
                    maxItems: 200
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Attempt or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/admin/notifications/channels:
    post:
      summary: Create notification channels
      description: Requires identity.manage. Permission checked again in security
        transaction; mutation is audited. Binding response id is the user ID.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: &id001
                    type: string
                    format: uuid
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or version conflict
          content:
            application/json:
