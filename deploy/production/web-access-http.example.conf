# 1 accepts any Host; set default to 0 to require an entry listed below.
# $http_host includes the external port; use the exact public authority.
map $http_host $entry_host_allowed {
    default 1;
    "8.222.163.55:8088" 1;
    "puppeteer.example.com" 1;
}
# This is the direct TCP peer. Behind a load balancer, allow its backend IP/CIDR.
# Never trust arbitrary X-Forwarded-For as a source identity.
geo $entry_peer_allowed {
    default 1;
    127.0.0.1 1;
    ::1 1;
    # 192.168.1.0/24 1;
}
# Permit container-local health checks, but no external health-check bypass.
map "$remote_addr|$uri" $entry_local_health {
    default 0;
    "127.0.0.1|/healthz" 1;
    "::1|/healthz" 1;
}
map "$entry_host_allowed:$entry_peer_allowed:$entry_local_health" $entry_denied {
    default 1;
    ~^1:1: 0;
    ~:1$ 0;
}
