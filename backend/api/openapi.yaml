components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nt_session
  responses:
    Error:
      description: HTTP status is authoritative. Unknown authenticated /api/ paths
        return 501; missing setup/session returns 418/401 first.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - reason
            - message
            - requestId
            properties:
              code:
                const: 0
              reason:
                type: string
              message:
                type: string
              requestId:
                type: string
  schemas:
    SSHJump:
      type: object
      required:
      - name
      - host
      - port
      - credentialId
      - enabled
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        parentId:
          type: string
          description: Empty for backend direct connection or upstream jump UUID.
            Changes clear host trust.
        credentialId:
          type: string
          format: uuid
        enabled:
          type: boolean
        version:
          type: integer
          description: Required current version for updates
        publicKey:
          type: string
          readOnly: true
        fingerprint:
          type: string
          readOnly: true
    User:
      type: object
      properties:
        id: *id001
        username: *id001
        nickname: *id001
        type: &id023
          enum:
          - admin
          - user
        status: &id024
          enum:
          - enabled
          - disabled
        mail: *id001
        remark: *id001
        version: *id002
        createdAt: &id025
          type: string
          format: date-time
        roleIds: &id026
          type: array
          items: *id001
        departmentIds: &id027
          type: array
          items: *id001
        enabledTotp: *id003
    UserWrite:
      type: object
      properties:
        id: *id001
        username: *id001
        nickname: *id001
        type: *id023
        status: *id024
        mail: *id001
        remark: *id001
        version: *id002
        createdAt: *id025
        roleIds: *id026
        departmentIds: *id027
        enabledTotp: *id003
        defaultDepartmentSource:
          enum:
          - ''
          - oidc
          - wecom
          writeOnly: true
          description: Optional explicit administrator pre-provisioning; create only,
            type=user, no roleIds or departmentIds. Does not bind an external identity.
        defaultDepartmentId:
          type: string
          writeOnly: true
          description: Required with source; must equal its current configured department.
            Mismatch or missing configuration returns 409. Must be absent otherwise.
        password:
          type: string
          writeOnly: true
          description: Required on creation, 12+ characters and <=1024 UTF-8 bytes.
            Empty on edit retains password.
      required:
      - username
      - nickname
      - type
      - status
      additionalProperties: false
    Department:
      type: object
      properties:
        id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: string
          description: Empty for root, otherwise department UUID
        weight:
          type: integer
          minimum: 0
          maximum: 100000
        version: *id002
      required:
      - name
      additionalProperties: false
    Role:
      type: object
      properties:
        id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 100
        version: *id002
        permissions:
          type: array
          items:
            enum:
            - user.read
            - department.read
            - role.read
            - lock.read
            - audit.read
            - settings.read
            - asset.read
            - credential.read
            - grant.read
            - session.read
      required:
      - name
      additionalProperties: false
    Permission:
      type: object
      properties:
        action: *id001
        menu: *id001
        label: *id001
    LoginLock:
      type: object
      properties:
        id:
          type: string
          description: Normalized username
        failures: *id002
        lockedUntil:
          type:
          - string
          - 'null'
          format: date-time
    Asset:
      type: object
      properties: &id028
        id: *id004
        name:
          type: string
          maxLength: 100
        protocol:
          type: string
          enum:
          - ssh
          - telnet
          - rdp
          - vnc
        alias:
          type: string
          description: Empty or letter followed by letters/digits/_/-, maximum 64
            chars
        host: *id004
        port:
          type: integer
          minimum: 1
          maximum: 65535
        groupId: *id004
        jumpId:
          type: string
          description: Optional final SSH jump UUID, at most four hops. Mutually exclusive
            with all other route selectors.
        agentId:
          type: string
          description: Empty for direct backend connection; otherwise a non-revoked
            Agent UUID. Offline Agents never fall back to direct dialing.
        credentialId: *id005
        description:
          type: string
          maxLength: 2000
        enabled: *id008
        version: *id006
        connectTimeout:
          type: integer
          minimum: 1
          maximum: 300
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        gatewayGroupId:
          type: string
          description: Optional route UUID. agentId, jumpId, gatewayGroupId and proxyId
            are mutually exclusive; empty all means direct.
        proxyId:
          type: string
          description: Optional route UUID. agentId, jumpId, gatewayGroupId and proxyId
            are mutually exclusive; empty all means direct.
        certFingerprint:
          type: string
          maxLength: 512
          description: RDP SHA-256 certificate pin. Normal asset create/update automatically
            discovers it when omitted; changing endpoint or route forces rediscovery.
            Import retains the explicit pin contract. Existing sessions never silently
            trust a replacement certificate.
    AssetWrite:
      type: object
      properties: *id028
      required:
      - name
      - protocol
      - host
      - port
      - credentialId
      - connectTimeout
      additionalProperties: false
    ResourceGroup:
      type: object
      properties:
        id: *id004
        name: *id004
        parentId: *id004
        version: *id006
      required:
      - name
      additionalProperties: false
    CredentialMetadata:
      type: object
      properties:
        id: *id005
        name: *id004
        kind: &id029
          enum:
          - password
          - private-key
        username: *id004
        version: *id006
        activeVersion: *id006
        publicKey: *id004
        assetCount: *id006
    CredentialSecret:
      type: object
      properties:
        password:
          type: string
          maxLength: 4096
        privateKey:
          type: string
          description: PEM private key, max 32768 UTF-8 bytes
        passphrase:
          type: string
          maxLength: 4096
      additionalProperties: false
    CredentialWrite:
      type: object
      properties:
        id: *id005
        name: *id004
        kind: *id029
        username: *id004
        version: *id006
        activeVersion: *id006
        publicKey: *id004
        assetCount: *id006
        generate: *id008
        secret:
          $ref: '#/components/schemas/CredentialSecret'
      required:
      - name
      - kind
      - username
      additionalProperties: false
    ResourceGrant:
      type: object
      properties:
        id: *id004
        userId: *id004
        departmentId: *id004
        resourceId: *id005
        validFrom:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        version: *id006
      required:
      - resourceId
      additionalProperties: false
    SSHHostTrust:
      type: object
      properties:
        assetId: *id012
        host: *id013
        port: *id014
