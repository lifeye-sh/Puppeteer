components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nt_session
  schemas:
    Certificate:
      type: object
      properties:
        id: *id003
        name: *id003
        kind: *id003
        source: *id003
        pem: *id003
        fingerprint: *id003
        dnsNames:
          type: array
          items: *id003
        notBefore: &id004
          type: string
          format: date-time
        notAfter: *id004
        parentId: *id003
        userId: *id003
        version: *id002
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
    Account:
      type: object
      properties:
        id: *id003
        name: *id003
        directoryUrl: *id003
        email: *id003
        ca: *id003
        version: *id002
        termsAccepted: &id005
          type: boolean
      description: HTTPS directory URL (no URL credentials or fragment), valid contact
        email, name1..100 bytes and CA<=65536 bytes. termsAccepted=true required on
        every save. Directory URL immutable on update; current version required. Generated
        account private key never returned.
    Provider:
      type: object
      properties:
        id: *id003
        name: *id003
        zone: *id003
        server: *id003
        keyName: *id003
        version: *id002
    Order:
      type: object
      properties:
        id: *id003
        name: *id003
        accountId: *id003
        providerId: *id003
        domains:
          type: array
          items: *id003
        certificateId: *id003
        status: *id003
        autoRenew: *id005
        renewBeforeDays: *id002
        nextAttempt: *id004
        attempts: *id002
        error: *id003
        version: *id002
      description: Name1..100 bytes,1..20 normalized domains under provider zone;
        wildcard accepted. renewBeforeDays1..60. Update only changes name/autoRenew/renewBeforeDays,
        requires current version and non-processing state; account/provider/domains
        remain unchanged.
    ProviderWrite:
      type: object
      properties:
        id: *id003
        name: *id003
        zone: *id003
        server: *id003
        keyName: *id003
        version: *id002
        secret:
          type: string
          writeOnly: true
          maxLength: 4096
      required:
      - name
      - zone
      - server
      - keyName
      description: RFC2136 DNS provider. Zone/keyName normalized to FQDN; server host:port.
        Create requires standard Base64 secret with decoded length>=32 bytes. Blank
        secret on update retains sealed key. Version required to update.
    Create:
      type: object
      properties:
        name: *id003
        kind:
          type: string
          enum:
          - server
          - client_ca
          - client
        source:
          type: string
          enum:
          - import
          - self_signed
        domains:
          type: array
          items: *id003
          maxItems: 100
        days: *id002
        pem: *id003
        key:
          type: string
          writeOnly: true
        parentId: *id001
        userId: *id001
      required:
      - name
      - kind
      description: 'server/client_ca: import matching PEM/key or generate self_signed
        certificate, days1..3650. client: parent CA and enabled user required; days0
        uses configured default, explicit range1..825. Private keys encrypted at rest
        and not returned. Import enforces parsed certificate kind, key match and validity.'
    Problem:
      type: object
      properties:
        reason: *id003
        message: *id003
