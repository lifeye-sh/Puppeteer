openapi: 3.1.0
info:
  title: Certificate and ACME administration
  version: r16-schema99
security:
- session: []
paths:
  /api/admin/certificates:
    get:
      summary: List certificate metadata and public PEM
      description: 'Requires certificate.read. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
        '400':
          description: Invalid proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or MFA denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid certificate/input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Import or issue certificate
      description: 'Requires identity.manage. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: &id001
                    type: string
                    format: uuid
        '400':
          description: Invalid proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or MFA denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid certificate/input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create'
  /api/admin/certificates/{id}/revoke:
    post:
      summary: Revoke certificate
      description: Requires identity.manage. Optimistic version; certificate use is
        rechecked at consuming boundaries.
      responses:
        '204':
          description: Success
        '400':
          description: Invalid proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Permission or MFA denied
