    View:
      type: object
      properties:
        id:
          type: integer
        values:
          $ref: '#/components/schemas/Patch'
        readOnly:
          type: object
          properties:
            version:
              type: string
            security-level:
              const: custom
            ssh-server-private-key-exists:
              type: boolean
            asset-group-tree:
              type: string
              description: 'JSON array of current shared resource groups: id, name,
                parentId, children.'
            website-group-tree:
              type: string
              description: Same current shared resource directory; not a historical
                snapshot.
          description: Current operational metadata, not historical editable values.
        secrets:
          type: object
          additionalProperties:
            type: object
            properties:
              hasValue:
                type: boolean
        changedKeys:
          type: array
          items:
            type: string
        actor:
          type: string
        legacyWrite:
          type: boolean
        createdAt:
          type: string
          format: date-time
        state:
          enum:
          - requested
          - applying
          - effective
          - failed
          - stalled
        securityPending:
          type: boolean
          description: A stricter policy intersection remains enforced until required
            live consumers ACK.
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              state:
                enum:
                - requested
                - effective
                - failed
              error:
                type: string
              attempts:
                type: integer
              lastAppliedRevision:
                type: integer
                minimum: 0
                description: Latest revision with an effective ACK for this node,
                  across all revisions; 0 if none. This is a confirmation record,
                  not a claim that existing sessions changed. Offline nodes remain
                  excluded from aggregate state.
              online:
                type: boolean
              lastSeen:
                type: string
                format: date-time
              updatedAt:
                type:
                - string
                - 'null'
                format: date-time
