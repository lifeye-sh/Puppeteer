                    enum:
                    - terminal-events-v1
                    - guacamole-events-v1
                    - native-rdp-mp4-v1
                  segments:
                    type: array
                    items:
                      type: object
                      required:
                      - sequence
                      - startMs
                      - durationMs
                      - bytes
                      properties:
                        sequence:
                          type: integer
                          minimum: 1
                          maximum: 2048
                        startMs:
                          type: integer
                          minimum: 0
                        durationMs:
                          type: integer
                          minimum: 0
                        bytes:
                          type: integer
                          minimum: 0
                          maximum: 16777216
        default:
